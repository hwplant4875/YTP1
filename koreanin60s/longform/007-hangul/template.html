<!doctype html><html><head><meta charset="utf-8"><style>
/* Hangul lesson long-form, 1920x1080. Cream paper, pastel blobs, giant letters in the channel font (Baloo 2 + Jua), 뱁새 bottom-right
   (pops in at each chapter start). No intro, no chapter cards (layout v4); the first frame is already fully drawn (cover-safe). */
@font-face{font-family:'Baloo 2';font-weight:400 800;src:url('file:///home/user/YTP1/koreanin60s/assets/fonts/Baloo2.ttf')}
@font-face{font-family:'Jua';src:url('file:///home/user/YTP1/koreanin60s/assets/fonts/Jua.ttf')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#FFF7EC;font-family:"Baloo 2","Jua","Noto Color Emoji",sans-serif;font-weight:800;color:#2B2236}
#bg{position:absolute;inset:0;background:radial-gradient(700px 520px at 12% 18%,rgba(247,184,202,.55),transparent 70%),radial-gradient(760px 600px at 90% 85%,rgba(168,214,232,.55),transparent 70%),radial-gradient(600px 480px at 85% 10%,rgba(255,226,150,.45),transparent 70%),#FFF7EC}
#grid{position:absolute;inset:0;background-image:radial-gradient(rgba(43,34,54,.07) 2px,transparent 2px);background-size:46px 46px}
.lay{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 200px 60px}
.ko,.big,.blk,.cell{font-family:"Jua",sans-serif;font-weight:400}
em{font-style:normal;color:#E0457F}
.pill{display:inline-block;padding:10px 40px 2px;border-radius:60px;background:#F7B8CA;color:#2B2236;font-size:54px;line-height:74px;white-space:nowrap}
.S{font-size:128px;line-height:1.12}
.row.many{gap:24px}.row.many .cell{font-size:170px;min-width:200px;padding:24px 26px 6px}
.S .ko{font-size:230px;line-height:1.05;display:inline-block;margin-bottom:24px}
.S .num{font-size:260px;line-height:.95;color:#E0457F}
.S small{display:block;font-size:50px;color:#8A7A88;margin-top:26px}
.card{background:#fff;border-radius:46px;box-shadow:0 30px 80px rgba(120,80,100,.18),0 0 0 6px rgba(255,255,255,.9) inset;padding:40px 90px 36px;display:inline-flex;flex-direction:column;align-items:center}
.big{font-size:330px;line-height:1.05}
.rom{font-size:84px;color:#8A7A88;margin-top:6px}
.note{font-size:58px;margin-top:4px}
.c-p{color:#E0457F}.c-b{color:#4C86D9}.c-y{color:#E6A100}.c-m{color:#2FA58C}
.row{display:flex;gap:46px;align-items:center;justify-content:center}
.cell{font-size:250px;line-height:1;background:#fff;border-radius:40px;min-width:300px;padding:30px 40px 10px;box-shadow:0 24px 60px rgba(120,80,100,.16)}
.cell.hi{color:#E0457F;box-shadow:0 0 0 10px #F7B8CA,0 24px 60px rgba(120,80,100,.2)}
.op{font-size:150px;color:#B9A9B5;font-family:"Baloo 2"}
.blk{font-size:260px;line-height:1;background:#fff;border-radius:40px;padding:30px 50px 10px;box-shadow:0 24px 60px rgba(120,80,100,.16)}
.res{color:#E0457F;box-shadow:0 0 0 10px #F7B8CA,0 24px 60px rgba(120,80,100,.2)}
.sub{font-size:70px;color:#8A7A88;margin-top:34px}
.I{display:flex;align-items:center;gap:90px;text-align:left}
.ph{background:#fff;border-radius:34px;padding:20px;box-shadow:0 30px 80px rgba(120,80,100,.2);transform:rotate(-1.5deg)}
.ph img{display:block;height:600px;max-width:820px;object-fit:cover;border-radius:18px}
.I .S{text-align:left;white-space:nowrap;font-size:96px}
.qw{font-size:250px}
.emo{font-size:120px;line-height:1.1}
.qn{font-size:64px;color:#E0457F;margin-bottom:20px}
.ring{position:absolute;right:260px;top:430px;width:170px;height:170px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:rgba(224,69,127,.15);stroke-width:9}
.ring .rf{stroke:#E0457F;stroke-dasharray:276.5;stroke-linecap:round}
#stk{position:absolute;right:40px;bottom:30px;width:230px;height:230px;background-size:contain;background-repeat:no-repeat;background-position:center bottom;filter:drop-shadow(0 12px 16px rgba(120,80,100,.25));transform-origin:50% 100%}
#brand{position:absolute;left:44px;top:34px;font-size:40px;color:#2B2236;opacity:.55}
#brand b{color:#E0457F}
</style></head><body>
<div id="bg"></div><div id="grid"></div><div id="stage"></div>
<div id="brand">Korean in <b>60s</b></div>
<div id="stk"></div>
<script>
/*DATA*/
const E=D.ev, st=document.getElementById('stage');
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x), clamp=x=>x<0?0:x>1?1:x;
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
E.forEach((v,i)=>{const d=document.createElement('div');d.className='lay';let h='';
  if(v.k=='S') h=`<div class="S pp">${v.html}</div>`;
  if(v.k=='L') h=`<div class="card pp"><div class="big c-${v.c}">${v.big}</div>${v.rom?`<div class="rom">${v.rom}</div>`:''}${v.note?`<div class="note">${v.note}</div>`:''}</div>`;
  if(v.k=='I') h=`<div class="I"><div class="ph pp"><img src="img/${v.img}.jpg"></div><div class="S pp">${v.html}</div></div>`;
  if(v.k=='Q') h=`<div class="qn">#${v.n}</div><div class="card pp"><div class="big qw">${v.word}</div></div><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><circle class="rf" cx="50" cy="50" r="44"/></svg>`;
  if(v.k=='A') h=`<div class="card pp"><div class="emo">${v.emo}</div><div class="big qw c-p">${v.word}</div><div class="rom">${v.rom}</div><div class="note">= ${v.mean}</div></div>`;
  if(v.k=='R') h=`<div class="row${v.items.length>5?' many':''}">${v.items.map((s,j)=>`<div class="cell pp${v.hi===j?' hi':''}">${s}</div>`).join('')}</div>${v.note?`<div class="sub">${v.note}</div>`:''}`;
  if(v.k=='B') h=`<div class="row">${v.parts.map((s,j)=>(j?'<div class="op">+</div>':'')+`<div class="blk pp">${s}</div>`).join('')}<div class="op eq">=</div><div class="blk res">${v.res}</div></div><div class="sub">${v.rom}${v.note?' '+v.note:''}</div>`;
  d.innerHTML=h;v.el=d;v.pp=[...d.querySelectorAll('.pp')];v.res=d.querySelector('.res');v.eq=d.querySelector('.eq');v.sub=d.querySelector('.sub');st.appendChild(d);});
const sk=document.getElementById('stk');
window.render=function(t){
  let cur=0;for(let i=0;i<E.length;i++) if(E[i].t<=t) cur=i;
  E.forEach((v,i)=>{let o=0;
    if(i==cur) o=ease((t-v.t)/0.4); else if(i==cur-1) o=1-ease((t-E[cur].t)/0.4);
    const full=(i==0&&cur==0); if(full) o=1; // cover-safe first frame
    v.el.style.opacity=o; v.el.style.display=o>0?'flex':'none';
    if(o<=0) return; const dt=full?9:t-v.t;
    v.pp.forEach((p,j)=>{const q=ease((dt-0.1*j)/0.5);p.style.transform=`translateY(${(1-q)*24}px) scale(${0.96+0.04*q})`;p.style.opacity=clamp((dt-0.1*j)/0.35);});
    if(v.res){const d0=0.1*v.pp.length+0.3,q=ease((dt-d0)/0.5);v.res.style.transform=`scale(${0.85+0.15*q})`;v.res.style.opacity=clamp((dt-d0)/0.35);v.eq.style.opacity=clamp((dt-d0+0.1)/0.2);}
    if(v.k=='Q'){const rf=v.el.querySelector('.rf');rf.style.strokeDashoffset=276.5*clamp((t-v.t-0.6)/Math.max(0.5,v.t1-v.t-0.8));}
    if(v.sub){const d1=v.res?0.12*v.pp.length+0.6:0.5;v.sub.style.opacity=clamp((dt-d1)/0.3);}
  });
  const v=E[cur]; sk.style.backgroundImage=`url(img/st_${v.pose}.png)`;
  let c0=cur;while(c0>0&&E[c0-1].ch==v.ch) c0--; const since=c0==0?9:t-E[c0].t, pop=back((since-0.2)/0.6);
  sk.style.transform=`translateY(${Math.sin(t*2.2)*7}px) rotate(${Math.sin(t*1.3)*3}deg) scale(${pop})`;
};
window.render(0);
</script></body></html>
