<!doctype html><html><head><meta charset="utf-8"><style>
/* KPDH recap long-form v2, 1920x1080. Sources full-frame, centered captions, a year timeline along the bottom, Netflix views / awards chips
   top-right, 뱁새 in the bottom-right corner (pops in at each chapter). Channel font: Baloo 2 (Latin) + Jua (Hangul), both rounded. */
@font-face{font-family:'Baloo 2';font-weight:400 800;src:url('file:///home/user/YTP1/koreanin60s/assets/fonts/Baloo2.ttf')}
@font-face{font-family:'Jua';src:url('file:///home/user/YTP1/koreanin60s/assets/fonts/Jua.ttf')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0d0a1f;font-family:"Baloo 2","Jua","Noto Color Emoji",sans-serif;font-weight:800;color:#fff}
#sky{position:absolute;inset:0;background:radial-gradient(900px 600px at 15% 20%,rgba(255,70,170,.22),transparent 70%),radial-gradient(800px 700px at 85% 75%,rgba(120,80,255,.25),transparent 70%),#0d0a1f}
.lay{position:absolute;inset:0;opacity:0;overflow:hidden}
.ph{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:50% 45%}
.vbg{position:absolute;inset:-40px;background-size:cover;background-position:center}
.vfg{position:absolute;top:0;height:100%;left:50%;background-size:cover;background-position:center;box-shadow:0 0 80px rgba(0,0,0,.8);transform-origin:50% 45%}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,3,18,.82) 0%,rgba(6,3,18,.35) 24%,transparent 42%),linear-gradient(180deg,rgba(6,3,18,.5) 0%,transparent 16%)}
.dim{position:absolute;inset:0;background:rgba(8,4,24,.6)}
.stroke{paint-order:stroke fill;-webkit-text-stroke:14px #000}
.cap{position:absolute;left:50%;bottom:168px;max-width:1560px;width:max-content;text-align:center;font-size:74px;line-height:1.05;padding:16px 44px 6px;border-radius:30px;background:rgba(10,6,28,.88);box-shadow:0 12px 40px rgba(0,0,0,.5);paint-order:stroke fill;-webkit-text-stroke:10px #000}
.hook .cap{font-size:92px;bottom:168px}
em{font-style:normal;color:#F7B8CA}
.big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 120px}
.num{font-size:280px;line-height:.9;color:#F7B8CA}
.lbl{font-size:70px;line-height:1.05;margin-top:30px;max-width:1500px}
.stmt{font-size:118px;line-height:1.08}
.stmt small{display:block;font-size:60px;margin-top:24px;color:#eee}
.paper{position:absolute;left:960px;top:520px;width:1180px;background:#fff;border-radius:22px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.paper img{width:100%;display:block;border-radius:8px}
.paper .src{color:#555;font-size:32px;margin-bottom:12px;letter-spacing:.04em;text-transform:uppercase}
/* year timeline along the bottom, visible from the first frame */
#tl{position:absolute;left:0;top:930px;width:1920px;height:150px;background:linear-gradient(0deg,rgba(6,3,18,.85),rgba(6,3,18,.55) 60%,transparent)}
#tl .in{position:absolute;left:110px;top:28px;width:1700px;height:100px}
#tl .bar{position:absolute;left:0;top:30px;width:100%;height:10px;border-radius:5px;background:rgba(255,255,255,.18)}
#tl .fill{position:absolute;left:0;top:30px;height:10px;border-radius:5px;background:linear-gradient(90deg,#ff3fa4,#F7B8CA);box-shadow:0 0 18px #ff3fa4}
#tl .tick{position:absolute;top:24px;width:4px;height:22px;margin-left:-2px;background:rgba(255,255,255,.4);border-radius:2px}
#tl .ml{position:absolute;top:58px;width:140px;margin-left:-70px;text-align:center;font-size:30px;color:rgba(255,255,255,.7)}
#tl .ml.yr{color:#F7B8CA;font-size:36px;top:54px}
#tl .dot{position:absolute;top:17px;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px rgba(255,63,164,.55),0 0 34px 10px rgba(255,63,164,.8)}
/* counters */
#chips{position:absolute;right:44px;top:38px;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.chip{padding:6px 28px 2px;border-radius:60px;background:rgba(12,8,30,.72);border:3px solid rgba(255,255,255,.25);font-size:46px;line-height:66px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.45);transform-origin:100% 50%}
.chip b{color:#F7B8CA;font-weight:800}
#stk{position:absolute;right:26px;bottom:150px;width:190px;height:190px;background-size:contain;background-repeat:no-repeat;background-position:center bottom;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55));transform-origin:50% 100%}
/* chapter, title, Korean moment, outro */
.chap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.chap .n{font-size:52px;letter-spacing:.25em;color:#F7B8CA}
.chap .q{font-size:128px;line-height:1.04;max-width:1640px;margin-top:16px}
.pill{display:inline-block;padding:8px 34px 2px;border-radius:50px;background:#F7B8CA;color:#1a1030;font-size:44px;line-height:64px;white-space:nowrap}
.chap .d{margin-top:40px}
.cst{position:absolute;right:120px;bottom:60px;width:300px;height:300px;background-size:contain;background-repeat:no-repeat;background-position:center bottom;transform-origin:50% 100%}
.ko{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:90px;background:radial-gradient(900px 600px at 50% 50%,rgba(247,184,202,.30),transparent 70%)}
.ko .w{font-family:"Jua",sans-serif;font-weight:400;font-size:270px;line-height:1}
.ko .r{font-size:72px;color:#F7B8CA;margin-top:18px}
.ko .mn{font-size:64px;margin-top:6px}
.ko .st{width:440px;height:440px;background-size:contain;background-repeat:no-repeat;background-position:center}
.ttl .a{font-size:160px;line-height:1}
.ttl .b{font-size:84px;color:#F7B8CA;margin-top:22px;letter-spacing:.1em}
/* real-person photos in white cards (voice cast, singers) */
.gw{position:absolute;left:0;right:0;top:110px;display:flex;justify-content:center;gap:44px}
.gc{background:#fff;border-radius:26px;padding:16px 16px 10px;box-shadow:0 30px 80px rgba(0,0,0,.65);text-align:center;color:#141020}
.gc .pi{border-radius:14px;background-size:cover;background-position:center top}
.gc .nm{font-size:46px;line-height:1.1;margin-top:14px}
.gc .su{font-size:32px;line-height:1.1;color:#d0457f;margin-bottom:4px}
.sub{margin-top:46px;display:inline-block;padding:14px 64px 6px;border-radius:60px;background:#ff0033;font-size:66px}
</style></head><body>
<div id="sky"></div><div id="stage"></div>
<div id="tl"><div class="in" id="tli"><div class="bar"></div><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div></div>
<div id="chips" class="lay" style="inset:auto;right:44px;top:38px"><div class="chip" id="cv">👀 <b id="vv"></b> views</div><div class="chip" id="ca">🏆 <b id="av"></b> awards</div></div>
<div id="stk" class="lay" style="inset:auto;right:26px;bottom:150px"></div>
<script>
/*DATA*/
const MON=["JUN","JUL","AUG","SEP","OCT","NOV","DEC","JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT"];
const E=D.ev, st=document.getElementById('stage'), X=m=>m/16*1700, tli=document.getElementById('tli');
// labels: every other month, "JUN 2025" at the start and the year "2026" right after DEC
MON.forEach((s,i)=>{const k=document.createElement('div');k.className='tick';k.style.left=X(i)+'px';tli.appendChild(k);
  const lab=i==0?"JUN '25":i==7?'2026':(i%2==0||i==16)?s:null; if(!lab) return;
  const l=document.createElement('div');l.className='ml'+(i==0||i==7?' yr':'');l.style.left=X(i)+'px';l.textContent=lab;tli.appendChild(l);});
const C1=E.findIndex(e=>e.k=='C'), TI=E.findIndex(e=>e.k=='T');
// timeline position at time t: the hook sweeps the whole year once, chapters glide between their months, the outro stays at the end
function mAt(i){const e=E[i];return e.ch==0?16:(e.m!=null?e.m:16);}
const img=n=>`url(img/${n}.jpg)`, bg=n=>`url(img/${n}_bg.jpg)`;
function photo(v,dim){ if(!v.img) return dim?'<div class="dim" style="background:rgba(8,4,24,.35)"></div>':''; // full-frame photo; vertical sources sit on a blurred copy of themselves
  if(v.ar&&v.ar<1.25) return `<div class="vbg" style="background-image:${bg(v.img)}"></div><div class="vfg ph2" style="width:${Math.round(1080*v.ar)}px;margin-left:-${Math.round(540*v.ar)}px;background-image:${img(v.img)}"></div>`+(dim?'<div class="dim"></div>':'');
  return `<div class="ph ph2" style="background-image:${img(v.img)}"></div>`+(dim?'<div class="dim"></div>':'');}
function numParts(s){const m=s.match(/^([^0-9]*)([0-9][0-9,]*\.?[0-9]*)(.*)$/);return m?[m[1],m[2],m[3]]:null}
E.forEach((v,i)=>{const d=document.createElement('div');d.className='lay'+(v.ch==0?' hook':'');let h='';
  if(v.k=='P') h=photo(v)+'<div class="grad"></div>'+(v.cap?`<div class="cap">${v.cap}</div>`:'');
  if(v.k=='B') h=photo(v,1)+`<div class="big"><div class="stmt stroke">${v.text}</div></div>`;
  if(v.k=='N') h=photo(v,1)+`<div class="big"><div class="num stroke">${v.num}</div><div class="lbl stroke">${v.label}</div></div>`;
  if(v.k=='H') h=photo(v,1)+`<div class="paper"><div class="src">${v.src}</div><img src="img/${v.head}.jpg"></div>`;
  if(v.k=='G'){const w=v.cards.length>4?270:v.cards.length>3?330:400;h=photo(v,1)+'<div class="gw">'+v.cards.map(c=>`<div class="gc"><div class="pi" style="width:${w}px;height:${Math.round(w*1.25)}px;background-image:${img(c.img)}"></div><div class="nm">${c.name}</div><div class="su">${c.sub}</div></div>`).join('')+'</div>';}
  if(v.k=='T') h=`<div class="vbg" style="background-image:${bg(v.img)}"></div><div class="chap ttl"><div class="a stroke">KPop Demon Hunters</div><div class="b stroke">THE ENTIRE STORY</div></div>`;
  if(v.k=='C') h=`<div class="vbg" style="background-image:${bg(v.img)};opacity:.75"></div><div class="chap"><div class="n">CHAPTER ${v.i}</div><div class="q stroke">${v.q}</div><div class="d pill">${v.date}</div></div><div class="cst" style="background-image:url(img/st_${v.pose}.png)"></div>`;
  if(v.k=='K') h=`<div class="ko"><div><div class="pill">🇰🇷 KOREAN MOMENT</div><div class="w" style="margin-top:34px">${v.w}</div><div class="r">${v.rom}</div><div class="mn">= ${v.mean}</div></div><div class="st" style="background-image:url(img/st_${v.pose}.png)"></div></div>`;
  if(v.k=='O') h=`<div class="ko"><div style="text-align:center"><div class="ttl"><div class="a stroke" style="font-size:120px">Korean in 60s</div></div><div class="sub">SUBSCRIBE</div></div><div class="st" style="background-image:url(img/st_love_heart.png)"></div></div>`;
  d.innerHTML=h;v.el=d;v.ph=d.querySelector('.ph2');v.nm=d.querySelector('.num');v.pp=d.querySelector('.paper');v.cp=d.querySelector('.cap');v.cs=d.querySelector('.cst, .ko .st');v.gcs=[...d.querySelectorAll('.gc')];st.appendChild(d);
  if(v.nm) v.np=numParts(v.num);});
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x), clamp=x=>x<0?0:x>1?1:x;
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}; // overshoot pop
function fmtV(n){return n==null?'':(n>=100?(Number.isInteger(n)?n:n.toFixed(1)):n)+'M'+(n>=500?'+':'')}
const body=v=>v&&(v.k=='P'||v.k=='B'||v.k=='N'||v.k=='H'||v.k=='G')&&v.ch>=1&&v.ch<=8;
window.render=function(t){
  let cur=0;for(let i=0;i<E.length;i++) if(E[i].t<=t) cur=i;
  const FD=E[cur].ch==0&&E[cur].k!='T'?0.14:0.45; // the hook cuts fast
  E.forEach((v,i)=>{let o=0;
    if(i==cur) o=ease((t-v.t)/FD); else if(i==cur-1) o=1-ease((t-E[cur].t)/FD);
    if(cur==0&&i==0) o=1; // the video opens straight on the first picture
    v.el.style.opacity=o; v.el.style.display=o>0?'block':'none';
    if(o>0){const p=(t-v.t)/Math.max(1,(v.t1-v.t));
      if(v.ph) v.ph.style.transform=v.ch==0?`scale(${1.04+0.10*(1-ease((t-v.t)/0.5))+0.03*Math.min(1,p)})`:`scale(${1.0+0.07*Math.min(1.2,p)})`;
      if(v.cp){const q=back((t-v.t-0.05)/0.45);v.cp.style.transform=`translate(-50%,${(1-q)*40}px) scale(${0.85+0.15*q})`;v.cp.style.opacity=clamp((t-v.t)/0.2);}
      if(v.pp){const q=back((t-v.t)/0.6);v.pp.style.transform=`translate(-50%,-50%) rotate(-1.2deg) scale(${0.85+0.15*q})`;}
      if(v.cs){const q=back((t-v.t-0.35)/0.55);v.cs.style.transform=`scale(${q}) rotate(${Math.sin(t*2)*3}deg)`;}
      v.gcs.forEach((g,j)=>{const q=back((t-v.t-0.12*j)/0.55);g.style.transform=`translateY(${(1-q)*60}px) scale(${0.8+0.2*q})`;g.style.opacity=clamp((t-v.t-0.12*j)/0.25);});
      if(v.nm&&v.np){const q=ease((t-v.t-0.1)/0.9),raw=v.np[1].replace(/,/g,''),val=parseFloat(raw)*q,dec=(raw.split('.')[1]||'').length;
        let s=val.toFixed(dec); if(v.np[1].includes(',')) s=Number(s).toLocaleString('en-US'); v.nm.textContent=v.np[0]+s+v.np[2];}
    }});
  const v=E[cur], prev=E[cur-1], f=ease((t-v.t)/0.45);
  const ov=(on,was)=>on?(was?1:f):(was?1-f:0);
  // timeline (always on)
  const m1=mAt(cur), m0=cur>0?mAt(cur-1):m1, m=m0+(m1-m0)*ease((t-v.t)/0.8); document.getElementById('dot').style.left=X(m)+'px'; document.getElementById('fill').style.width=X(m)+'px';
  // chips, sticker: inside chapter bodies only
  const ch=document.getElementById('chips'), sk=document.getElementById('stk');
  const bo=ov(body(v),body(prev)); ch.style.opacity=bo; sk.style.opacity=bo;
  const s=body(v)?v:(body(prev)?prev:null);
  if(s){
    const vv=s.cnt.views, aw=s.cnt.awards, pv=prev&&prev.cnt||{};
    const cv=document.getElementById('cv'), ca=document.getElementById('ca');
    cv.style.display=vv?'block':'none'; document.getElementById('vv').textContent=fmtV(vv);
    ca.style.display=aw?'block':'none'; document.getElementById('av').textContent=aw||'';
    cv.style.transform=`scale(${s===v&&vv!=pv.views?0.7+0.3*back((t-v.t-0.2)/0.5):1})`;
    ca.style.transform=`scale(${s===v&&aw!=pv.awards?0.7+0.3*back((t-v.t-0.2)/0.5):1})`;
    sk.style.backgroundImage=`url(img/st_${s.pose}.png)`;
    // 뱁새 jumps in at the first beat of each chapter, then bobs gently
    let c0=cur;while(c0>0&&body(E[c0-1])&&E[c0-1].ch==s.ch) c0--; const since=t-E[c0].t, pop=back((since-0.2)/0.6);
    sk.style.transform=`translateY(${Math.sin(t*2.2)*7}px) rotate(${Math.sin(t*1.3)*3}deg) scale(${pop})`;
  }
};
window.render(0);
</script></body></html>
